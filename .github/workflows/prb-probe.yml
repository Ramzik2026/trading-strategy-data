name: Trading AI 15m API paging diagnostic
on:
  push:
    branches: [research/multiagent-year-v12]
    paths: ['research/probe_15m.py','.github/workflows/prb-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe historical candles
        run: python research/probe_15m.py
