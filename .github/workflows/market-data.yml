name: Bybit public market snapshot
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public market data
        run: python scripts/collect.py
      - name: Commit latest snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Bybit snapshot"
            git push
          fi
