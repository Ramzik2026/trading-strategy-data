name: Market data (BingX primary)
on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect BingX public perpetual market data
        id: collect
        continue-on-error: true
        run: python scripts/collect_bingx.py
      - name: Publish snapshot and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/latest.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update BingX market snapshot"
            git pull --rebase
            git push
          fi
      - name: Fail when snapshot incomplete
        if: steps.collect.outcome != 'success'
        run: exit 1
