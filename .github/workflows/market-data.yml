name: Bybit public market snapshot
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public market data
        id: fetch
        continue-on-error: true
        run: python scripts/collect.py
      - name: Commit snapshot and diagnostic status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: update Bybit snapshot and connectivity status"
            git push
          fi
      - name: Fail workflow when collection fails
        if: steps.fetch.outcome == 'failure'
        run: exit 1
