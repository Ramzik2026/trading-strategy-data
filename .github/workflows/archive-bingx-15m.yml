name: Trading AI BingX 15m historical archive (research)
on:
  push:
    branches:
      - research/multiagent-year-v12
    paths:
      - 'scripts/archive_bingx_15m.py'
      - '.github/workflows/archive-bingx-15m.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
permissions:
  contents: write
concurrency:
  group: bingx-15m-archive-research
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/multiagent-year-v12
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect public closed 15m futures candles without keys
        run: python scripts/archive_bingx_15m.py
      - name: Publish only validated historical archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/archive/bingx-perpetual-15m
          if ! git diff --cached --quiet; then
            git commit -m "research-data: append verified BingX 15m history"
            git pull --rebase origin research/multiagent-year-v12
            git push origin HEAD:research/multiagent-year-v12
          fi
