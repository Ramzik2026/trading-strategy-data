name: BingX 15m archive (read-only market data)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/archive_bingx_15m.py'
      - 'research/tests/test_archive_bingx_15m.py'
      - '.github/workflows/bingx-15m-archive.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
permissions:
  contents: write
concurrency:
  group: bingx-15m-archive-main
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check archive integrity with offline test cases
        run: python -m unittest discover -s research/tests -p 'test_archive_bingx_15m.py' -v
      - name: Fetch only closed public USDT perpetual candles
        run: python scripts/archive_bingx_15m.py
      - name: Append validated data without touching latest.json or other agents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/archive/bingx-perpetual-15m
          if ! git diff --cached --quiet; then
            git commit -m "data: append verified 15m BingX OHLCV archive"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
